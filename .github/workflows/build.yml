name: macOS build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test battery events and HUD timeline
        run: bash scripts/test.sh
      - name: Build universal app
        run: bash scripts/build-app.sh --universal
      - uses: actions/upload-artifact@v4
        with:
          name: Endfield-Charge-macOS
          path: dist/Endfield-Charge-macOS.zip
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Endfield-Charge-macOS
          path: release
      - name: Publish tagged build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes_file="docs/releases/$GITHUB_REF_NAME.md"
          if [[ -f "$notes_file" ]]; then
            notes=(--notes-file "$notes_file")
          else
            notes=(--generate-notes)
          fi
          gh release create "$GITHUB_REF_NAME" release/Endfield-Charge-macOS.zip --repo "$GITHUB_REPOSITORY" --title "Endfield Charge $GITHUB_REF_NAME" "${notes[@]}"
